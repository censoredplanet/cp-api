schema:
  - ./*.graphqls

exec:
  filename: ./generated/generated.go
  package: generated

model:
  filename: ./model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: ./
  package: experimental

struct_tag: json

resolvers_always_return_pointers: false

autobind:
  - "github.com/censoredplanet/cp-api/internal/entities"

models:
  DateTime:
    model:
      - github.com/99designs/gqlgen/graphql.Time

  Date:
    model:
      - github.com/censoredplanet/cp-api/internal/scalar.Date

  Hyperquack:
    model:
      - github.com/censoredplanet/cp-api/internal/entities.Hyperquack
    fields:
      retry:
        resolver: true
      receivedTlsVersion:
        resolver: true
      receivedTlsCipherSuite:
        resolver: true
      serverAsn:
        resolver: true

  Satellite:
    model:
      - github.com/censoredplanet/cp-api/internal/entities.Satellite
    fields:
      retry:
        resolver: true
      resolverAsn:
        resolver: true
      receivedRcode:
        resolver: true
      answersAsn:
        resolver: true
      answersHttpsTlsVersion:
        resolver: true
      answersHttpsTlsCipherSuite:
        resolver: true

  Dashboard:
    model:
      - github.com/censoredplanet/cp-api/internal/entities.Dashboard
